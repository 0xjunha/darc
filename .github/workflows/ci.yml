name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings -W clippy::all

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: "Install nextest"
        uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo +stable nextest run --workspace

  workspace-version-gate:
    name: Workspace Version Gate
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        name: Detect workspace package version
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          workspace_version() {
            awk '
              /^\[workspace\.package\]$/ { in_workspace = 1; next }
              /^\[/ { in_workspace = 0 }
              in_workspace && /^[[:space:]]*version[[:space:]]*=/ {
                line = $0
                sub(/^[^"]*"/, "", line)
                sub(/".*$/, "", line)
                print line
                exit
              }
            ' "$@"
          }

          head_version="$(workspace_version Cargo.toml)"
          if [[ -z "$head_version" ]]; then
            printf 'Cargo.toml missing [workspace.package] version\n' >&2
            exit 1
          fi

          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" =~ ^0+$ ]]; then
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
            printf 'workspace version changed: <none> -> %s\n' "$head_version"
            exit 0
          fi

          base_ref="$BASE_SHA"
          if ! git cat-file -e "$base_ref:Cargo.toml" 2>/dev/null; then
            if [[ "$EVENT_NAME" == "push" ]]; then
              printf 'changed=true\n' >> "$GITHUB_OUTPUT"
              printf 'base Cargo.toml unavailable at %s on push; running dist checks\n' "$base_ref"
              exit 0
            fi

            merge_base="$(git merge-base "$base_ref" HEAD 2>/dev/null || true)"
            if [[ -n "$merge_base" ]] && git cat-file -e "$merge_base:Cargo.toml" 2>/dev/null; then
              printf 'base Cargo.toml unavailable at %s; using merge-base %s\n' "$base_ref" "$merge_base"
              base_ref="$merge_base"
            elif [[ "$EVENT_NAME" == "pull_request" ]] && git cat-file -e "HEAD^:Cargo.toml" 2>/dev/null; then
              printf 'base Cargo.toml unavailable at %s; using HEAD^\n' "$base_ref"
              base_ref="HEAD^"
            else
              printf 'changed=true\n' >> "$GITHUB_OUTPUT"
              printf 'base Cargo.toml unavailable at %s; running dist checks\n' "$base_ref"
              exit 0
            fi
          fi

          base_cargo="$(git show "$base_ref:Cargo.toml")"
          base_version="$(printf '%s\n' "$base_cargo" | workspace_version)"
          if [[ -z "$base_version" ]]; then
            printf 'base Cargo.toml missing [workspace.package] version\n' >&2
            exit 1
          fi

          if [[ "$base_version" != "$head_version" ]]; then
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'workspace version: %s -> %s\n' "$base_version" "$head_version"

  dist-check:
    name: Dist Check (${{ matrix.target }})
    needs:
      - workspace-version-gate
    if: needs.workspace-version-gate.outputs.changed == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check dist target
        run: cargo +stable check --locked --workspace --all-targets --all-features --profile dist --target ${{ matrix.target }}

  coverage:
    name: Coverage
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: "Install nextest"
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Collect code coverage data
        env:
          CARGO_INCREMENTAL: "0"
          RUSTFLAGS: "-C debuginfo=0"
        run: cargo +stable llvm-cov nextest --lcov --output-path lcov.info

      - name: Upload coverage data to codecov
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # pin@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: lcov.info
          fail_ci_if_error: false
