[workspace]
resolver = "3"

members = [
    "crates/agent",
    "crates/cli",
    "crates/core",
    "crates/index",
    "crates/paths",
    "crates/query",
    "crates/rollout-audit",
    "crates/rollout",
    "crates/sync",
    "crates/test-utils",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Junha Park <0xjunha@gmail.com>"]
repository = "https://github.com/0xjunha/darc"

[workspace.dependencies]
# Internal Dependencies
darc-agent = { path = "crates/agent" }
darc-core = { path = "crates/core" }
darc-index = { path = "crates/index" }
darc-paths = { path = "crates/paths" }
darc-query = { path = "crates/query" }
darc-rollout-audit = { path = "crates/rollout-audit" }
darc-rollout = { path = "crates/rollout" }
darc-sync = { path = "crates/sync" }
darc-test-utils = { path = "crates/test-utils" }
# External Dependencies
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
directories = "6.0.0"
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
glob = { version = "0.3.3", default-features = false }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.39.0", default-features = false, features = ["bundled"] }
regex = { version = "1.12.3", default-features = false, features = ["std", "perf", "unicode-perl"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tar = "0.4.44"
thiserror = "2.0.18"
toml = "0.9.8"
walkdir = "2.5.0"
