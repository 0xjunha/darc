[workspace]
resolver = "3"

members = [
    "crates/cli",
    "crates/core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Junha Park <0xjunha@gmail.com>"]
repository = "https://github.com/0xjunha/memstack"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
directories = "6.0.0"
memstack-core = { path = "crates/core" }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
walkdir = "2.5.0"
