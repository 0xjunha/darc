[workspace]
resolver = "3"

members = [
    "crates/cli",
    "crates/core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Junha Park <0xjunha@gmail.com>"]
repository = "https://github.com/0xjunha/darc"

[workspace.dependencies]
# Internal Dependencies
darc-core = { path = "crates/core" }
# External Dependencies
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
directories = "6.0.0"
flate2 = { version = "1.1.5", default-features = false, features = ["rust_backend"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.39.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tar = "0.4.44"
toml = "0.9.8"
walkdir = "2.5.0"
